function interact(){const it=interactTarget();if(!it||hero.gather)return;
 if(it.type==='node'){hero.gather={o:it.o,t:0,dur:NODE[it.o.type].dur}}
 else if(it.type==='chest'){chest.opened=true;chest.img=T.chestO;burst(chest.x,chest.y-8,26,['#f6d860','#fff2a0','#e0a040'],70,40);gold+=80+MI*40;qAdd('chest');toast('Rương bí mật! +'+(80+MI*40)+' vàng','#f6d860')}
 else if(it.type==='portal'){toast('Cổng ⛩ đưa bạn về Làng (demo)','#9fe6dc')}}
function heroAttack(){if(hero.atk>0||hero.gather)return;hero.atk=0.32;hero.st='atk';hero.t=0;
 const fx=hero.dir===2?(hero.flip?-1:1):0,fy=hero.dir===0?1:hero.dir===1?-1:0;
 const cx=hero.x+fx*12,cy=hero.y-4+fy*10;
 for(let i=0;i<8;i++){const a=Math.atan2(fy,fx)+(i/7-0.5)*1.8;parts.push({x:hero.x+Math.cos(a)*13,y:hero.y-6+Math.sin(a)*9,vx:Math.cos(a)*20,vy:Math.sin(a)*20,g:0,life:0.16,max:0.16,c:i%2?'#ffffff':'#cfe8ff',sz:2,type:'slash'})}
 for(const m of mobs){if(m.dead||m.lift||m.caged)continue;const d=Math.hypot(m.x-cx,m.y-cy);if(d<20+(m.boss?6:0)){const dmg=ri(9,16)+(R()<0.15?12:0);hitMob(m,dmg,fx||((m.x-hero.x)/(d+1)),fy||((m.y-hero.y)/(d+1)))}}}
function hitMob(m,dmg,dx,dy){m.hp-=dmg;m.flashT=0.12;m.showHp=3;m.aggro=true;const kb=m.boss?0.3:1;m.kx=dx*70*kb;m.ky=dy*50*kb;floater(m.x,m.y-m.sh.fy*0.6,dmg,dmg>20?'#ffd34a':'#ffffff',dmg>20);
 burst(m.x,m.y-8,6,['#ffffff','#ffe0a0'],50,10);
 if(m.hp<=0){m.dead=true;m.st='die';m.t=0;m.resp=m.boss?30:9;if(MAP.killRe.test(m.name))qAdd('kill');if(m.boss){qAdd('boss');toast('Đã hạ '+m.name+'!','#ff9a6a')}const g=ri(4,9)*m.lv;gold+=g;hero.exp=Math.min(1,hero.exp+0.04);setTimeout(()=>toast('+'+g+' vàng · '+m.name,'#f6d860'),350)}
 else if(!m.boss||R()<0.3){m.st='hurt';m.t=0}}
function hurtHero(d){hero.hp=Math.max(1,hero.hp-d);hero.hurtT=0.25;floater(hero.x,hero.y-26,d,'#ff6a5a')}

function stepHero(dt){
 let mx=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0),my=(keys['s']||keys['arrowdown']?1:0)-(keys['w']||keys['arrowup']?1:0);
 if(hero.atk>0){hero.atk-=dt;mx*=0.25;my*=0.25}
 const l=Math.hypot(mx,my);
 if(l>0){mx/=l;my/=l;if(hero.gather)hero.gather=null;
  if(hero.atk<=0){if(Math.abs(mx)>Math.abs(my)+0.1){hero.dir=2;hero.flip=mx<0}else hero.dir=my>0?0:1}
  const sp=74*(hero.atk>0?0.25:1),nx=hero.x+mx*sp*dt,ny=hero.y+my*sp*dt;
  if(!blocked(nx,hero.y,4))hero.x=nx;if(!blocked(hero.x,ny,4))hero.y=ny;
  hero.step+=dt;if(hero.step>0.22){hero.step=0;const k=K[(hero.y|0)*W+(hero.x|0)];parts.push({x:hero.x+rnd(-3,3),y:hero.y,vx:rnd(-6,6),vy:-4,g:0,life:0.4,max:0.4,c:k===3?'#d6b088':k===6?'#b0b2a8':'#8fb69a',sz:1,type:'dust'})}}
 if(hero.atk<=0)hero.st=l>0?'walk':'idle';
 hero.t+=dt;
 if(hero.gather){const g=hero.gather,N=NODE[g.o.type];g.t+=dt;g.o.shake=0.2;if(R()<dt*14)burst(g.o.x,g.o.y-8,1,N.chips,40,30);
  if(g.t>=g.dur){g.o.left--;g.t=0;burst(g.o.x,g.o.y-8,10,N.chips,60,40);qAdd(g.o.type);toast('+1 '+N.item,N.c);if(g.o.left<=0){g.o.resp=14;hero.gather=null}}}
 const nearRest=Math.hypot(hero.x-rest.x,hero.y-rest.y)<34;hero.resting=nearRest;
 hero.hp=Math.min(hero.max,hero.hp+dt*(nearRest?14:1.2));hero.mp=Math.min(hero.mmax,hero.mp+dt*(nearRest?8:0.8));
 if(hero.hurtT>0)hero.hurtT-=dt;
 if(PROPS.rustle){const b=PROPS.rustle;if(Math.hypot(hero.x-b.x,hero.y-b.y)<14)b.shake=0.4}}

function stepMob(m,dt){m.t+=dt;if(m.flashT>0)m.flashT-=dt;if(m.showHp>0)m.showHp-=dt;if(m.atkCd>0)m.atkCd-=dt;
 if(m.caged){m.st='idle';m.dir=0;return}
 if(m.dead){if(m.t>0.6)m.alpha=Math.max(0,1-(m.t-0.6)*1.5);m.resp-=dt;if(m.resp<=0){m.dead=false;m.hp=m.max;m.alpha=0;m.x=m.spawn[0];m.y=m.spawn[1];m.st='idle';m.aggro=false;m.t=0;burst(m.x,m.y-6,10,['#cfe8d0','#ffffff'],30,20)}return}
 if(m.alpha<1)m.alpha=Math.min(1,m.alpha+dt*2);
 const dh=Math.hypot(hero.x-m.x,hero.y-m.y);
 if(m.lift){faceTo(m,hero.x-m.x,hero.y-m.y);if(m.st==='atk'&&m.t>0.4){m.st='idle';m.t=0}
  if(dh<130&&m.atkCd<=0){m.st='atk';m.t=0;m.atkCd=rnd(1.8,2.6);arrows.push({x:m.x,y:m.y-m.lift-8,tx:hero.x,ty:hero.y-8,t:0,d:Math.max(0.3,dh/170)})}return}
 if(Math.abs(m.kx)+Math.abs(m.ky)>1){const nx=m.x+m.kx*dt,ny=m.y+m.ky*dt;if(!blocked(nx,m.y,3))m.x=nx;if(!blocked(m.x,ny,3))m.y=ny;m.kx*=Math.pow(0.002,dt);m.ky*=Math.pow(0.002,dt)}
 if(m.st==='hurt'){if(m.t>0.28){m.st='idle';m.t=0}return}
 if(m.st==='atk'){if(m.t>0.45){m.st='idle';m.t=0}return}
 if(m.aggro&&(dh>170||Math.hypot(m.x-m.hx,m.y-m.hy)>m.hr+160))m.aggro=false;
 if(!m.aggro&&m.boss&&dh<60)m.aggro=true;
 let tx,ty,sp=m.speed;
 if(m.aggro){tx=hero.x;ty=hero.y;sp=m.speed*1.9;if(dh<15+(m.boss?4:0)){if(m.atkCd<=0){m.st='atk';m.t=0;m.atkCd=1.4;faceTo(m,hero.x-m.x,hero.y-m.y);setTimeout(()=>{if(!m.dead&&Math.hypot(hero.x-m.x,hero.y-m.y)<22)hurtHero(ri(2,5)+(m.boss?6:0))},250)}else{m.st='idle'}return}}
 else if(m.orb){const o=m.orb;m.oa=(m.oa||o.ph)+o.sp*dt;tx=o.cx+Math.cos(m.oa+o.ph)*o.rx;ty=o.cy+Math.sin(m.oa+o.ph)*o.ry}
 else if(m.patrol){const p=m.patrol[m.pi];tx=p[0];ty=p[1];if(Math.hypot(tx-m.x,ty-m.y)<4){if(m.pi+m.pd<0||m.pi+m.pd>=m.patrol.length)m.pd*=-1;m.pi+=m.pd}}
 else{if(m.wait>0){m.wait-=dt;m.st='idle';return}tx=m.tx;ty=m.ty;
  if(Math.hypot(tx-m.x,ty-m.y)<2){m.wait=rnd(1.2,4);let k=0;do{const a=R()*Math.PI*2,r=Math.sqrt(R())*m.hr;m.tx=m.hx+Math.cos(a)*r;m.ty=m.hy+Math.sin(a)*r*0.7}while((blocked(m.tx,m.ty,4)||fires.some(f=>Math.hypot(m.tx-f.x,m.ty-f.y)<26))&&k++<12);return}}
 const dx=tx-m.x,dy=ty-m.y,d=Math.hypot(dx,dy)||1,vx=dx/d*sp,vy=dy/d*sp;
 const nx=m.x+vx*dt,ny=m.y+vy*dt;let moved=false;
 if(!blocked(nx,m.y,3)){m.x=nx;moved=true}if(!blocked(m.x,ny,3)){m.y=ny;moved=true}
 if(!moved&&!m.aggro){m.tx=m.x;m.ty=m.y;if(m.patrol){m.pd*=-1;m.pi=clamp(m.pi+m.pd,0,m.patrol.length-1)}}
 m.st='walk';faceTo(m,vx,vy)}
function faceTo(m,vx,vy){if(Math.abs(vx)>Math.abs(vy)){m.dir=2;m.flip=vx<0}else m.dir=vy>0?0:1}

function stepAmbient(dt){
 const camx=cam.x,camy=cam.y;
 if(R()<dt*5){const vis=ents.filter(e=>e.k==='tree'&&e.x>camx-20&&e.x<camx+VWW+20&&e.y>camy&&e.y<camy+VWH+70);if(vis.length){const t=pick(vis);const sacred=t===PROPS.sacred;
  parts.push({x:t.x+rnd(-26,26)*(sacred?2:1),y:t.y-rnd(30,60)*(sacred?2:1),vx:rnd(4,14),vy:rnd(6,12),g:0,life:rnd(3,5),max:5,c:sacred?pick(['#c8a8f0','#e8d0ff']):MI===3?pick(['#a8a050','#c89a50','#8a8a48']):pick(['#7aa884','#5f8f74','#9cc28a','#c6b25e']),sz:1,type:'leaf',ph:R()*6})}}
 for(const f of fires){if(f.x<camx-60||f.x>camx+VWW+60||f.y<camy-60||f.y>camy+VWH+80)continue;const fy=f.y-f.lift;
  if(R()<dt*(f.big?16:7))parts.push({x:f.x+rnd(-3,3),y:fy-6,vx:rnd(-6,6),vy:rnd(-30,-16),g:0,life:rnd(0.5,1.1),max:1.1,c:pick(['#ffd36a','#ff9a3c','#fff0b0']),sz:1,type:'spark'});
  if(R()<dt*(f.big?3:1.2))parts.push({x:f.x+rnd(-2,2),y:fy-12,vx:rnd(2,6),vy:rnd(-12,-8),g:0,life:3,max:3,c:'#c8d0cc',sz:2,type:'smoke'})}
 if(!chest.opened&&R()<dt*1.6)parts.push({x:chest.x+rnd(-8,8),y:chest.y-rnd(4,14),vx:0,vy:-4,g:0,life:0.7,max:0.7,c:'#fff6c0',sz:1,type:'twinkle'});
 if(R()<dt*5){const n=pick(nodes);const N=NODE[n.type];if(N.tw&&n.left>0)parts.push({x:n.x+rnd(-5,5),y:n.y-rnd(6,13),vx:0,vy:-5,g:0,life:0.8,max:0.8,c:pick([N.tw,'#ffffff']),sz:1,type:'twinkle'})}
 if(R()<dt*10){const a=R()*Math.PI*2;parts.push({x:portal.x+Math.cos(a)*10,y:portal.y-20+Math.sin(a)*12,vx:-Math.cos(a)*6,vy:-Math.sin(a)*6-4,g:0,life:1,max:1,c:pick(['#9fe6dc','#c8b4ff','#ffffff']),sz:1,type:'twinkle'})}
 if(MAP.fall&&R()<dt*8)parts.push({x:MAP.fall+rnd(-8,8),y:base[MAP.fall]+rnd(-2,4),vx:rnd(-8,8),vy:rnd(-10,-2),g:0,life:1.2,max:1.2,c:'#d8eee8',sz:2,type:'mist'});
 for(const p of MAP.ponds)if(R()<dt*1.2){let x,y,k=0;do{x=p.x+rnd(-p.rx,p.rx);y=p.y+rnd(-p.ry,p.ry);k++}while(K[(y|0)*W+(x|0)]!==4&&k<20);parts.push({x,y,vx:0,vy:0,g:0,life:1.6,max:1.6,c:'#b6d8cd',sz:1,type:'ripple'})}
 if(PROPS.sacred&&R()<dt*8){const t=PROPS.sacred;parts.push({x:t.x+rnd(-60,60),y:t.y-rnd(20,140),vx:rnd(-3,3),vy:rnd(-6,-2),g:0,life:2,max:2,c:pick(['#e8d0ff','#bfa0ff','#9fe6dc']),sz:1,type:'twinkle'})}
 if(MI===2&&R()<dt*3){const m=pick(ents.filter(e=>e.menhir));if(m)parts.push({x:m.x+rnd(-2,2),y:m.y-rnd(8,18),vx:0,vy:-6,g:0,life:1,max:1,c:'#6fe0d6',sz:1,type:'twinkle'})}
 if(R()<dt*6)parts.push({x:camx+rnd(0,VWW),y:camy+rnd(0,VWH),vx:rnd(3,9),vy:rnd(-3,1),g:0,life:3,max:3,c:'#f4f2d0',sz:1,type:'mote',ph:R()*6});
 if(MAP.fireflies){const dk=darkAt(camx+VWW/2);if(R()<dt*(MAP.mist?5:12)*Math.max(0.3,dk*2.4))parts.push({x:camx+rnd(0,VWW),y:camy+rnd(0,VWH),vx:rnd(-4,4),vy:rnd(-4,4),g:0,life:rnd(2,4),max:4,c:pick(['#e8ff9a','#c8ff7a']),sz:1,type:'firefly',ph:R()*6})}
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue}
  if(p.type==='leaf'){p.x+=(p.vx+Math.sin(time*3+p.ph)*10)*dt;p.y+=p.vy*dt}
  else if(p.type==='mote'||p.type==='firefly'){p.x+=(p.vx+Math.sin(time*2+p.ph)*4)*dt;p.y+=(p.vy+Math.cos(time*1.7+p.ph)*3)*dt}
  else{p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.type==='chip'&&p.life<p.max-0.3){p.g=0;p.vx*=0.9;p.vy*=0.9}}}
 for(let i=arrows.length-1;i>=0;i--){const a=arrows[i];a.t+=dt/a.d;if(a.t>=1){arrows.splice(i,1);if(Math.hypot(hero.x-a.tx,hero.y-8-a.ty)<10)hurtHero(ri(2,4));else burst(a.tx,a.ty+8,3,['#8a6a4a','#c8b090'],20,10)}}
 for(const b of butterflies){b.t+=dt;const ax=Math.sin(b.t*0.7+b.c.length)*30+Math.sin(b.t*2.3)*20,ay=Math.cos(b.t*0.9)*20+Math.sin(b.t*3.1)*14;b.vx+=(ax-b.vx)*dt*2;b.vy+=(ay-b.vy)*dt*2;b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(Math.hypot(b.x-hero.x,b.y-hero.y)<20){b.vx+=(b.x-hero.x)*dt*20;b.vy+=(b.y-hero.y)*dt*20}b.x=clamp(b.x,40,W-40);b.y=clamp(b.y,120,H-40)}
 for(const c of clouds){c.x+=9*dt;c.y+=3*dt;if(c.x>W+300){c.x=-300;c.y=rnd(0,H)}if(c.y>H+200)c.y=-200}
 if(streaks.length<7&&R()<dt*3)streaks.push({x:camx-30+rnd(-20,VWW*0.6),y:camy+rnd(0,VWH),l:rnd(14,30),life:rnd(0.6,1.1),max:1.1});
 for(let i=streaks.length-1;i>=0;i--){const s=streaks[i];s.life-=dt;s.x+=150*dt;s.y+=38*dt;if(s.life<=0)streaks.splice(i,1)}
 for(let i=floaters.length-1;i>=0;i--){floaters[i].life-=dt;floaters[i].y-=22*dt;if(floaters[i].life<=0)floaters.splice(i,1)}
 for(let i=toasts.length-1;i>=0;i--){toasts[i].life-=dt;if(toasts[i].life<=0)toasts.splice(i,1)}
 for(const n of nodes){if(n.shake>0)n.shake-=dt;if(n.left<=0){n.resp-=dt;if(n.resp<=0){n.left=n.max;burst(n.x,n.y-6,8,['#ffffff','#cfe8d0'],30,20)}}}
 if(PROPS.rustle&&PROPS.rustle.shake>0)PROPS.rustle.shake-=dt;else if(PROPS.rustle&&R()<dt*0.5)PROPS.rustle.shake=0.3}
function darkAt(x){return MAP.dark?clamp((x-MAP.dark.x0)/(W-MAP.dark.x0),0,1)*MAP.dark.max:0}

const cam={x:0,y:0};
function step(dt){time+=dt;bannerT+=dt;stepHero(dt);for(const m of mobs)stepMob(m,dt);
 const lx=hero.dir===2?(hero.flip?-1:1)*14:0,ly=hero.dir===0?10:hero.dir===1?-10:0;
 const tx=clamp(hero.x+lx-VWW/2,0,W-VWW),ty=clamp(hero.y-10+ly-VWH/2,0,H-VWH);
 const k=1-Math.exp(-5*dt);cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k;
 stepAmbient(dt);
 for(const e of ents)if(e.k==='tree'&&!e.plateau){const under=Math.abs(hero.x-e.x)<e.fw&&hero.y<e.y-4&&hero.y>e.y-e.fh;e.a+=((under?0.42:1)-e.a)*Math.min(1,dt*8)}}

// ================= render =================
let OX=0,OY=0;
const sn=v=>Math.round(v*S)/S;
function wind(x,y){return Math.sin(time*1.7-x*0.022-y*0.008)+Math.sin(time*0.6-x*0.006)*0.6}
function drawSheet(sh,row,frame,x,y,flip,alpha,flash){const c=sh.cell,dx=sn(x-sh.fx),dy=sn(y-sh.fy);ctx.globalAlpha=alpha;
 if(flip){ctx.save();ctx.translate(sn(x)*2,0);ctx.scale(-1,1);ctx.drawImage(sh.img,frame*c,row*c,c,c,dx,dy,c,c);if(flash){ctx.globalAlpha=0.85;ctx.drawImage(sh.flash,frame*c,row*c,c,c,dx,dy,c,c)}ctx.restore()}
 else{ctx.drawImage(sh.img,frame*c,row*c,c,c,dx,dy,c,c);if(flash){ctx.globalAlpha=0.85;ctx.drawImage(sh.flash,frame*c,row*c,c,c,dx,dy,c,c)}}
 ctx.globalAlpha=1}
function animFrame(st,t,once){const a=ANIM[st];const f=Math.floor(t*a[2]);return once?Math.min(a[1]-1,f):f%a[1]}
function drawEnt(e){
 if(e.k==='tree'){const img=e.img,x=e.x-e.ax,y=e.y-e.ay,w=wind(e.x,e.y)*(e.fw>40?0.35:0.55),sp=e.split,iw=img.width,ih=img.height;
  if(!e.plateau){ctx.globalAlpha=0.9;if(e.fw>40)ctx.drawImage(shadow(110),sn(e.x-55),sn(e.y-22));else ctx.drawImage(T.Shadow_TreeV3,sn(e.x-26),sn(e.y-10))}
  ctx.globalAlpha=e.plateau?1:e.a;
  ctx.drawImage(img,0,sp,iw,ih-sp,sn(x),sn(y+sp),iw,ih-sp);
  ctx.drawImage(img,0,0,iw,sp,sn(x+w),sn(y),iw,sp);ctx.globalAlpha=1;return}
 if(e.k==='spr'||e.k==='bush'||e.k==='chest'||e.k==='portal'){const w=e.img.width;
  if(e.k!=='portal'&&!e.noShadow&&e.ay<40){const sw=Math.min(40,w*0.8);ctx.drawImage(shadow(sw),sn(e.x-sw/2),sn(e.y-Math.max(3,Math.round(sw*0.36))/2-1))}
  if(e.k==='bush'){const o=wind(e.x,e.y)*0.35+(e.shake>0?Math.sin(time*50)*0.8:0);ctx.drawImage(e.img,0,0,w,e.img.height-8,sn(e.x-e.ax+o),sn(e.y-e.ay),w,e.img.height-8);ctx.drawImage(e.img,0,e.img.height-8,w,8,sn(e.x-e.ax),sn(e.y-8),w,8);return}
  ctx.drawImage(e.img,sn(e.x-e.ax),sn(e.y-e.ay));
  if(e.k==='portal')drawPortalFx(e);return}
 if(e.k==='flag'){const img=e.img,x0=e.x-e.ax,y0=e.y-e.ay;for(let c=0;c<img.width;c++){const off=c<4?0:Math.sin(time*4.2-c*0.45)*Math.min(1,(c-3)/6)*1.3;ctx.drawImage(img,c,0,1,img.height,sn(x0+c),sn(y0+off),1,img.height)}return}
 if(e.k==='node'){if(e.left<=0){ctx.globalAlpha=0.35;ctx.drawImage(shadow(12),sn(e.x-6),sn(e.y-3));ctx.globalAlpha=1;return}
  const img=T.node[e.type],sh=e.shake>0?Math.sin(time*60)*0.7:0;
  ctx.drawImage(shadow(img.width),sn(e.x-img.width/2),sn(e.y-3));ctx.drawImage(img,sn(e.x-img.width/2+sh),sn(e.y-img.height));return}
 if(e.k==='mob'){if(e.alpha<=0)return;const sh=e.sh;ctx.globalAlpha=e.alpha*0.9;const sw=Math.max(10,Math.round(sh.w*0.75));if(!e.lift)ctx.drawImage(shadow(sw),sn(e.x-sw/2),sn(e.y-2));
  let row,fr;if(e.caged){row=0;fr=animFrame('idle',e.t)}else if(e.st==='die'){row=12+e.dir;fr=animFrame('die',e.t,true)}else if(e.st==='hurt'){row=9+e.dir;fr=animFrame('hurt',e.t,true)}else if(e.st==='atk'){row=6+e.dir;fr=animFrame('atk',e.t,true)}else{const a=ANIM[e.st];row=a[0]+e.dir;fr=animFrame(e.st,e.t+e.x*0.01)}
  drawSheet(sh,row,fr,e.x,e.y-e.lift,e.flip,e.alpha,e.flashT>0);return}
 if(e.k==='hero'){const sh=SHT.Aren_Sheet;ctx.drawImage(shadow(14),sn(e.x-7),sn(e.y-3));let row,fr;
