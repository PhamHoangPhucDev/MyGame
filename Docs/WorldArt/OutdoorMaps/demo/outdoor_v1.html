function newMap(o){return Object.assign({objs:[],mobs:[],nodes:[],darks:[],dirts:[],paths:[],wpaths:[],wblobs:[],stones:[],roots:[],solid:[],clear:[],deco:[],fog:false,deep:0},o)}
let SEED=1;
function addObj(m,o){o.seed=SEED++;m.objs.push(o);if(o.solid){const[w,h]=o.solid;m.solid.push([o.x-w/2,o.y-h,o.x+w/2,o.y])}return o}
function tree(m,x,y,Rr,alt,bloom){const p=m.pal,seed=SEED++;const can=makeCanopy(seed,alt?p.leaf2:p.leaf,Rr,0.84,bloom);
 const th=Math.round(Rr*0.75),tw=Math.max(8,Math.round(Rr*0.34));const tr=makeTrunk(seed,p.bark,th,tw);
 return addObj(m,{x,y,img:tr,ax:tr.width/2,ay:tr.height,solid:[tw,6],shadow:Rr*0.9,canopy:{img:can,dx:-can.width/2,dy:-th-can.height+Math.round(Rr*0.45),rx:Rr,ry:Rr*0.84}})}
function bush(m,x,y,Rr,alt){const can=makeCanopy(SEED++,alt?m.pal.leaf2:m.pal.leaf,Rr,0.8);return addObj(m,{x,y,img:can,ax:can.width/2,ay:can.height-2,shadow:Rr*0.8,solid:[Rr*1.4,5]})}
function spr(m,x,y,img,solid,extra){return addObj(m,Object.assign({x,y,img,ax:img.width/2,ay:img.height,solid},extra||{}))}
function mob(m,type,lv,x,y,r,o){m.mobs.push(Object.assign({type,lv,x,y,hx:x,hy:y,r:r||40,tx:x,ty:y,wait:Math.random()*2,dir:0,flip:false,moving:false,ph:Math.random()*10},o||{}))}

function ringWall(m,cx,cy,rx,ry,img,gapA,gapW,step,solidW,vImg){const n=Math.ceil(Math.PI*(rx+ry)/step)*3;

  const vert=vImg&&Math.abs(Math.cos(a))>0.8;if(!vert&&i%3)continue;
  spr(m,Math.round(cx+Math.cos(a)*rx),Math.round(cy+Math.sin(a)*ry),vert?vImg:img,[vert?10:solidW,6])}}
function lineWall(m,x0,y0,x1,y1,img,step,gaps,solidW){const L=Math.hypot(x1-x0,y1-y0),n=Math.ceil(L/step);
 for(let i=0;i<=n;i++){const t=i/n,x=x0+(x1-x0)*t,y=y0+(y1-y0)*t;if(gaps&&gaps.some(g=>Math.hypot(x-g[0],y-g[1])<g[2]))continue;spr(m,Math.round(x),Math.round(y),img,[solidW,6])}}

function bake(m){
 const W=m.w,Hh=m.h,p=m.pal,cv=mk(W,Hh),g=cv.getContext('2d'),id=g.createImageData(W,Hh),D=id.data;

 const bb=pts=>{let a=[1e9,1e9,-1e9,-1e9];for(const q of pts){a[0]=Math.min(a[0],q[0]);a[1]=Math.min(a[1],q[1]);a[2]=Math.max(a[2],q[0]);a[3]=Math.max(a[3],q[1])}return a};
 const P=m.paths.map(q=>({q,b:bb(q.pts)})),WP=m.wpaths.map(q=>({q,b:bb(q.pts)}));
 const polyV=(arr,x,y)=>{let v=-1e9;for(const {q,b} of arr){if(x<b[0]-q.w-12||x>b[2]+q.w+12||y<b[1]-q.w-12||y>b[3]+q.w+12)continue;v=Math.max(v,q.w/2-distPoly(x,y,q.pts))}return v};
 for(let y=0;y<Hh;y++)for(let x=0;x<W;x++){
  const nz=(fbm(x/7,y/7,m.seed+1)-0.5)*9, n=fbm(x/36,y/36,m.seed),f=hash(x,y,m.seed+3);

  if(wv>0){const sh=(Math.sin((x*0.3+y*0.9)+fbm(x/12,y/12,4)*6)>0.85)?p.water[2]:(wv<3?p.water[2]:(q>0.55?p.water[1]:p.water[0]));col=wv<1.5?mul(p.water[2],1.05):sh;m.mask[y*W+x]=1}
  else if(sv>0){const bx=(x+((y>>3)&1)*5)%10,by=y%8;col=(bx===0||by===0)?p.stone[0]:(q>0.55?p.stone[2]:p.stone[1]);if(sv<2)col=p.stone[0]}
  else if(dv>0){const sec=false;col=dv<1.6?p.rim:(q<0.42?p.dirt[0]:q<0.55?p.dirt[1]:q<0.68?p.dirt[2]:p.dirt[3]);if(dv>1.6&&dv<3&&y%2===0)col=mul(p.dirt[0],0.95)}

  else{col=q<0.42?p.grass[0]:q<0.62?p.grass[1]:p.grass[2];if(dv>-2.2)col=mul(p.grass[0],0.86)}

  g.strokeStyle=css(p.bark[1]);g.lineWidth=4;g.stroke();g.strokeStyle=css(p.bark[2]);g.lineWidth=1;g.stroke()}
 // grass tufts and small decor
 const r=rng(m.seed+77);
 for(let i=0;i<W*Hh/900;i++){const x=Math.floor(r()*W),y=Math.floor(m.cliff+r()*(Hh-m.cliff));const k=m.mask[y*W+x];if(k)continue;
  const lt=mul(p.grass[2],1.12),dk=mul(p.grass[0],0.82);R(g,x,y,1,2,lt);R(g,x+2,y-1,1,3,lt);R(g,x+4,y,1,2,lt);R(g,x+1,y+2,3,1,dk)}

 for(let i=0;i<W*Hh/5200;i++){const x=Math.floor(r()*W),y=Math.floor(m.cliff+20+r()*(Hh-m.cliff-20));if(m.mask[y*W+x]||pathD(m,x,y)<4)continue;const n=decos[Math.floor(r()*(m.id===3?decos.length:decos.length-2))];if(IMG[n])g.drawImage(IMG[n],x-8,y-8)}
 if(m.id===3)for(let i=0;i<70;i++){const x=Math.floor(r()*W),y=Math.floor(m.cliff+20+r()*(Hh-m.cliff));R(g,x,y,2,2,H(0x8474b0));R(g,x,y,1,1,H(0xc8b8f0))}

 // arena floor rings for bosses
 for(const mo of m.mobs)if(mo.boss){g.strokeStyle='rgba(30,16,12,0.35)';g.lineWidth=2;g.beginPath();g.ellipse(mo.x,mo.y+4,40,26,0,0,7);g.stroke()}
 for(let y=0;y<m.cliff;y++)for(let x=0;x<W;x++)m.mask[y*W+x]=1;
 for(const[x0,y0,x1,y1] of m.solid)for(let y=Math.max(0,y0|0);y<Math.min(Hh,y1);y++)for(let x=Math.max(0,x0|0);x<Math.min(W,x1);x++)m.mask[y*W+x]=1;
 for(const[x0,y0,w,h] of m.clear)for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++)if(x>=0&&y>=0&&x<W&&y<Hh)m.mask[y*W+x]=0;
 if(m.hole){const[hx,hy]=m.hole;for(let y=hy-14;y<hy+6;y++)for(let x=hx-14;x<hx+14;x++)m.mask[y*W+x]=0}
 m.ground=cv;
 // minimap
 const mm=mk(W/8,Hh/8),mg=mm.getContext('2d');mg.imageSmoothingEnabled=true;mg.drawImage(cv,0,0,mm.width,mm.height);
 mg.fillStyle='rgba(16,26,22,0.55)';for(const o of m.objs)if(o.canopy)mg.fillRect(o.x/8-o.canopy.rx/9,(o.y+o.canopy.dy+o.canopy.img.height/2)/8-o.canopy.ry/9,o.canopy.rx/4.5,o.canopy.ry/4.5);
 mg.fillStyle='#2a2430';for(const[x0,y0,x1,y1] of m.solid)if(x1-x0<40)mg.fillRect(x0/8,y0/8,Math.max(1,(x1-x0)/8),1);
 m.mini=mm;
}
function drawCliff(g,m){const p=m.cliff>0?m.pal.cliff:null;if(!p)return;const r=rng(m.seed+31),Hc=m.cliff;
 R(g,0,0,m.w,Hc,p[0]);
 const tier=(y0,y1,minW,maxW)=>{let x=0;while(x<m.w){const w=minW+Math.floor(r()*(maxW-minW));const off=Math.floor(r()*4);
  R(g,x,y0+off,w,y1-y0-off,p[1]);R(g,x,y0+off,2,y1-y0-off,p[2]);R(g,x+1,y0+off,1,Math.min(6,y1-y0),p[3]);R(g,x+w-1,y0+off,1,y1-y0-off,p[0]);
  for(let yy=y0+off+5;yy<y1-2;yy+=5+Math.floor(r()*3))R(g,x+2,yy,w-3,1,mul(p[1],0.82));

 // mossy rim at the top

 for(let x=0;x<m.w;x+=2){const hh=1+Math.floor(fbm(x/6,9,m.seed)*3);R(g,x,Math.round(Hc*0.5)-1,2,hh,m.pal.leaf[2])}

// ---------- game state ----------
let MAP=null,mi=0,camX=0,camY=0,labels=true,showMini=true,banner=0,clock=0;
const hero={x:0,y:0,flip:false,moving:false,ph:0};
let gather=null;const floats=[];
const KEY={};
const CACHE={};
function loadMap(i){mi=i;if(!CACHE[i]){SEED=1000*(i+1);const m=BUILD[i]();bake(m);CACHE[i]=m}MAP=CACHE[i];
 hero.x=MAP.spawn[0];hero.y=MAP.spawn[1];banner=0;gather=null;
 document.querySelectorAll('#btns button').forEach((b,k)=>b.classList.toggle('on',k===i));}
function blocked(x,y){const m=MAP;if(x<6||y<0||x>=m.w-6||y>=m.h-2)return true;for(let dx=-3;dx<=3;dx+=3)if(m.mask[(y|0)*m.w+((x+dx)|0)])return true;return false}

function update(dt){clock+=dt;banner+=dt;
 let vx=0,vy=0;if(KEY.KeyA||KEY.ArrowLeft)vx--;if(KEY.KeyD||KEY.ArrowRight)vx++;if(KEY.KeyW||KEY.ArrowUp)vy--;if(KEY.KeyS||KEY.ArrowDown)vy++;
 hero.moving=!!(vx||vy);if(hero.moving){gather=null;const l=Math.hypot(vx,vy),sp=72*dt;const nx=hero.x+vx/l*sp,ny=hero.y+vy/l*sp;
  if(!blocked(nx,hero.y))hero.x=nx;if(!blocked(hero.x,ny))hero.y=ny;if(vx)hero.flip=vx<0;hero.ph+=dt}
 for(const n of MAP.nodes){if(n.cd>0){n.cd-=dt;if(n.cd<=0)n.left=3}}
 if(gather){gather.t+=dt;if(gather.t>=1.2){const n=gather.node;n.left--;floats.push({x:n.x,y:n.y-26,t:0,s:'+1 '+n.label});if(n.left<=0)n.cd=15;gather=n.left>0?null:null}}
 for(const f of floats)f.t+=dt;while(floats.length&&floats[0].t>1.2)floats.shift();
 for(const mo of MAP.mobs){mo.ph+=dt;
  if(mo.orbit){const o=mo.orbit;o.a+=o.w*dt;const nx=o.cx+Math.cos(o.a)*o.rx,ny=o.cy+Math.sin(o.a)*o.ry;mo.flip=nx<mo.x;mo.dir=Math.abs(nx-mo.x)>Math.abs(ny-mo.y)?2:(ny>mo.y?0:1);mo.x=nx;mo.y=ny;mo.moving=true;continue}
  if(mo.fixed||mo.boss){mo.moving=false;continue}
  if(mo.patrol){if(mo.pi===undefined){mo.pi=0;mo.pd=1}const t=mo.patrol[mo.pi];const dx=t[0]-mo.x,dy=t[1]-mo.y,d=Math.hypot(dx,dy);
   if(d<2){mo.pi+=mo.pd;if(mo.pi>=mo.patrol.length||mo.pi<0){mo.pd*=-1;mo.pi+=mo.pd*2}}else{const s=30*dt;mo.x+=dx/d*s;mo.y+=dy/d*s;mo.moving=true;mo.flip=dx<0;mo.dir=Math.abs(dx)>Math.abs(dy)?2:(dy>0?0:1)}continue}
  if(mo.wait>0){mo.wait-=dt;mo.moving=false;continue}
  const dx=mo.tx-mo.x,dy=mo.ty-mo.y,d=Math.hypot(dx,dy);
  if(d<1.5){mo.wait=1+Math.random()*3;const a=Math.random()*6.28,rr=Math.random()*mo.r;const tx=mo.hx+Math.cos(a)*rr,ty=mo.hy+Math.sin(a)*rr*0.7;if(!blocked(tx,ty)){mo.tx=tx;mo.ty=ty}}
  else{const s=18*dt;mo.x+=dx/d*s;mo.y+=dy/d*s;mo.moving=true;mo.flip=dx<0;mo.dir=Math.abs(dx)>Math.abs(dy)?2:(dy>0?0:1)}}
 camX=Math.max(0,Math.min(MAP.w-VW,hero.x-VW/2))|0;camY=Math.max(0,Math.min(MAP.h-VH,hero.y-VH/2-10))|0;
}

 if(labels){for(const mo of m.mobs){const sx2=(mo.x-camX)*S;if(sx2<-80||sx2>VW*S+80)continue;const c=CELL[mo.type]||48,sc=mo.scale||1,top=FOOT[mo.type]?(FOOT[mo.type].foot-FOOT[mo.type].top):20;
